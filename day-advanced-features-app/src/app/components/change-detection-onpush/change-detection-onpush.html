<div class="detection-card onpush">
  <div class="badge">OnPush</div>
  <h3>{{ user.name }}</h3>
  <p>Age: {{ user.age }}</p>
  <p class="checks">Checks: {{ checksCount }}</p>
  <p class="random">Random: {{ random | number: '1.0-4' }}</p>
  <p class="note">✅ Random getter only called when input reference changes!</p>
</div>
